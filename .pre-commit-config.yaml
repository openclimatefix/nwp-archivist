repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (--fix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, markdown]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true
      - id: pymarkdown
        name: pymarkdown (markdown files)
        entry: uv run pymarkdown scan
        language: system
        types: [markdown]
      # pydoclint compares each docstring's `Args:` and `Returns:` sections with the signature.
      # It runs from an isolated environment because it requires `docstring-parser-fork`.
      - id: pydoclint
        name: pydoclint (docstrings match signatures)
        entry: uv run --isolated --no-project --with pydoclint==0.9.1 pydoclint --quiet --style=google
        language: system
        types: [python]
